experiment_name: "informative_missingness"

data:
  tabular:
    data_path: "../dataset/preprocessed_tabular/"
    training_data: "cohort1" # file name for tabular data
    window_size: 7 # intitial window size for tabular data
    # x: features, m: missingness, delta: elapsed time since last observation
    feature_combinations: "m" # x, m, delta, x_delta, m_delta, x_m_delta
    feature_type: "numeric" # categorical, numeric
    aggregation_window_size: 12 # hours for aggregation
    training_feature: "gender" # target, gender, race, anchor_age
    age_threshold: 30 # age threshold for training feature
    insurance_type: private # private or non-private
  temporal:
    data_path: "../dataset/preprocessed_temporal/"

model:
  model_type: ["GradientBoosting"] #, ["RandomForest", "GradientBoosting", "LogisticRegression", "XGBoost"] #, "LSTM", "LogisticRegression"
  hyperparameters:
    # Random Forest model hyperparameters
    RandomForest:
      fixed_params:
        n_estimators: 200
        random_state: 42
        max_depth: 10
        min_samples_split: 5
        # class_weight: { 0: 1, 1: 2 }
      grid_search_params:
        n_estimators: [100, 200]
        max_depth: [5, 10]
        min_samples_split: [2, 5]
        min_samples_leaf: [1]
        class_weight:           
          - null
          - "balanced"
          - { 0: 0.5, 1: 1 }
          - { 0: 0.5, 1: 2 }

    # Gradient Boosting model hyperparameters
    GradientBoosting:
      fixed_params:
        learning_rate: 0.1
        n_estimators: 200  # number of boosting stages to be run
        max_depth: 5
        min_samples_split: 5
        min_samples_leaf: 2
        
      grid_search_params:
        learning_rate: [0.01, 0.05, 0.1, 0.2]
        n_estimators: [100, 200]
        max_depth: [null, 5, 10]
        min_samples_split: [2, 5]
        min_samples_leaf: [1, 2]
    
    # LogisticRegression model hyperparameters
    LogisticRegression:
      fixed_params:
        penalty: "l2"
        C: 1.0
        solver: "liblinear"
      grid_search_params:
        penalty: ["l1", "l2"]
        C: [0.1, 1.0, 10.0]
        solver: ["liblinear"]

    # XGBoost model hyperparameters
    XGBoost:
      fixed_params:
        learning_rate: 0.1
        max_depth: 5
        n_estimators: 200
        scale_pos_weight: 2
        objective: [binary:logistic]
        eval_metric: logloss
      grid_search_params:
        learning_rate: [0.01, 0.1]
        max_depth: [3, 5]
        n_estimators: [100, 150, 200]
        scale_pos_weight: [1, 2]
        objective: [binary:logistic]
        #eval_metric: logloss

training:
  validation_split: 0.2
evaluation:
  metrics: ["accuracy", "f1_score", "precision", "recall"]
logging:
  log_level: "info" # options: debug, info, warning, error, critical
  log_format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
